# pages.yml - ядро состава страниц v8. Потолок 7600 знаков, до 30 id блоков.
# Читают /site proto и verify-data.mjs (id для facts[].q, gaps[].hits, must_have).
# id: "Ф | ВОПРОС | ЧТО ОТВЕТ ДЕЛАЕТ | ФОРМА | ЗНАКИ | NEEDS | FALLBACK"
# Ф: Р результат, Д доказательство, К квалификация, В возражение; писателю не видна,
# нужна для арифметики: блоков В не больше половины. NEEDS - одно из пяти: число,
# состав, условие, действие, граница. FALLBACK - без факта блок снят или короче;
# плейсхолдер запрещен, вопрос в gaps. Типа страницы article не существует.

sig:
  price_open:  "цена видна у лидеров | must_have, seen_numbers | price обязателен"
  visit:       "нужен выезд или замер | business.what, directions | steps и geo обязательны, в hero срок"
  long_cycle:  "решают дольше недели | segments[].choose | усиливает cases и docs"
  licensed:    "работа лицензируемая | legal, facts[].artifact | docs обязателен"
  urgent:      "выбирают за час, авария | segments[].pain | hero несет телефон и срок, длинные блоки снять"
  b2b:         "платит организация | segments[].who | delivery про счет, cta_form длиннее"
  catalog:     "выбирают по номенклатуре | business.type shop либо both | включает category, facet, product"
  geo_bound:   "цена и срок зависят от адреса | business.geo | geo обязателен, зоны с ценой"
  serp_hot:    "у лидеров длинные тексты под листингом | must_have | cat_text по верхней границе"

blocks:
  hero:          "Р | Куда я попал и что тут дают | называет работу, регион и один проверяемый параметр | заголовок, 2 строки, кнопка | 180-400 | число | без числа - обещание и действие"
  numbers:       "Д | Давно вы этим занимаетесь | переводит опыт в цифры, которые можно проверить | 3-5 плашек цифра и подпись | 90-240 | число | цифр меньше трех - снят"
  nav:           "Р | Какой из разделов мой | разводит читателя по направлениям | 4-8 плиток, строка на плитку | 200-600 | состав | меньше четырех - снят, ссылки в hero"
  scope:         "Р | Что входит в работу за эти деньги | закрывает догадку о границах услуги | список 5-9 пунктов | 300-700 | состав | перечня нет - снят, границы в price"
  fit:           "К | Это мой случай | 4-6 проверяемых утверждений и названный порог | список и строка порога | 250-550 | условие | признаков случая нет - снят"
  not_fit:       "К | С кем вы не работаете | называет признак отказа, а не характер | 2-4 строки | 120-300 | граница | признака нет - снят, вопрос в gaps"
  problem:       "В | У меня такая беда, вы ее закрываете | ставит рядом ситуацию и работу, которая ее решает | 3-5 пар | 300-650 | состав | пар нет - снят"
  result:        "Р | Что будет у меня на руках в конце | перечисляет то, что остается у клиента | 3-5 пунктов | 200-450 | состав | перечня нет - снят"
  edge:          "Д | Почему вы, а не соседи | причина и доказательство в одной строке | 3-6 карточек | 300-700 | число | без proof не пишется, меньше трех - снят"
  compare:       "В | Какой вариант мне брать | разводит 2-4 варианта по цене, сроку и условию | таблица 3-5 строк | 250-700 | число | цифр по вариантам нет - снят"
  price:         "К | Сколько это выйдет у меня | дает вилку и привязывает ее к случаю | 2-4 группы цена и состав | 250-700 | число | цены нет - снят, вопрос в gaps"
  price_factors: "В | Почему дороже, чем в объявлении | называет 3-5 условий, двигающих цену | пары условие и эффект | 250-550 | условие | условий нет - снят"
  steps:         "Р | Что будет после моей заявки | 4-7 шагов, у каждого срок | нумерованные шаги | 300-700 | действие | сроков нет - блок снят"
  cases:         "Д | Вы такое уже делали | 2-5 работ с объемом, сроком и итогом | карточки с цифрами | 300-800 | число | объема и срока нет - снят"
  reviews:       "Д | Что говорят те, кто платил | прямая речь в кавычках только из forum или client | 3-6 цитат с подписью | 250-700 | состав | своих отзывов нет - снят, persona в кавычки не идет"
  docs:          "Д | Чем подтверждаете право на работу | документ, номер, срок действия | 2-5 строк | 120-350 | число | номера документа нет - снят"
  about:         "Д | Кто вы такие | год, люди, база, оборудование, без истории успеха | 2-3 абзаца | 300-700 | число | цифр нет - снят"
  geo:           "К | Вы до меня доедете и за сколько | называет зоны и условие выезда | список зон и условие | 150-450 | граница | границы выезда нет - снят"
  delivery:      "Р | Как я получу и как оплачу | срок, способ, условие бесплатного | две колонки по 3-5 строк | 200-500 | условие | условий нет - снят"
  qa:            "В | Остался вопрос, вы его не закрыли | 4-8 ответов на возражения из audience | аккордеон | 400-900 | состав | меньше четырех возражений - снят"
  cta_mid:       "Р | Готов, что дальше | одно действие, связанное с предыдущим блоком | строка и кнопка | 60-160 | действие | действия нет - снят"
  cta_form:      "Р | Как с вами связаться | форма под регистр и один ответный срок | форма 3-5 полей | 120-320 | действие | срока нет - снята строка срока"
  cat_intro:     "Р | Тот ли это раздел и что в нем | что лежит в разделе и от какой цены | абзац над листингом | 200-500 | число | цены от нет - только состав раздела"
  listing:       "Р | Покажите позиции и дайте отобрать | листинг, фильтры, пустое состояние | сетка и рейл фильтров | 0-120 | состав | позиций нет - пустое состояние"
  subcats:       "Р | Куда копать дальше | 4-12 подкатегорий одной плиткой | плитки | 100-350 | состав | подкатегорий нет - снят"
  cat_text:      "Д | Как выбирать в разделе | параметры выбора, применимость, что двигает цену | 3-6 абзацев | 800-2000 | состав | параметров нет - 300-600 по составу раздела"
  gallery:       "Р | Что это за позиция и как выглядит | несет H1, фото, цену, наличие | галерея и панель | 120-350 | число | цены нет - строка цена по запросу, блок не снят"
  specs:         "Д | Подойдет ли по параметрам | 6-20 характеристик парами | таблица | 150-600 | число | характеристик нет - снят, вопрос в gaps"
  product_desc:  "Р | Зачем мне именно эта позиция | назначение, отличие от соседних, комплект | 2-4 абзаца | 400-1200 | состав | отличия нет - 150-400"
  related:       "Р | А если эта не подойдет | 4-8 позиций того же класса | карточки | 0-120 | состав | позиций нет - снят"

# skel - стартовый состав по типу. Знак ! - блок не снимается никогда, без фактуры идет
# по своему FALLBACK. Финал - арифметика: must_have добавляет, пустой NEEDS снимает.
# Категория и фасет - про фильтры и листинг, текст это метатеги, intro и текст под ним.
skel:
  landing:  "hero! numbers scope fit price! steps edge cases reviews price_factors qa cta_mid cta_form!"
  home:     "hero! numbers nav! edge cases reviews about cta_mid cta_form!"
  service:  "hero! scope! fit edge price! steps cases reviews price_factors qa cta_mid cta_form!"
  category: "cat_intro! listing! subcats cat_text! cta_form"
  facet:    "cat_intro! listing! cat_text cta_form"
  product:  "gallery! specs! product_desc delivery reviews related cta_form!"
  info:     "ПРАВИЛО, не рецепт: блок ставится, если его NEEDS закрыт фактом publish yes, порядок как в blocks; меньше трех - страницы нет"

# not_fit, problem, result и compare в стартовые составы не входят ни при каком типе сайта:
# они появляются либо из must_have разведки, либо по правилу страницы info. Это не потеря,
# а решение: без них страница короче, а с ними - только если так делает рынок.
