# rules.yml - реестр правил проверки страницы v8. Потолок 6000 знаков.
#
# Читает verify-page.mjs. Список правил живет ЗДЕСЬ, в коде его нет: правило без
# проверки и проверка без правила валят прогон с кодом 2, разойтись реестру и коду
# негде. Тяжесть тоже отсюда: перенос id из block в warn меняет поведение скрипта,
# и трогать скрипт для этого не надо.
#
# Ровно два раздела и ни одного третьего.
#   block - валит прогон, потолок 12 правил. Сюда идет только то, что машина решает
#           одна и без суждения о вкусе: число, стоп-лист, лимит, арифметика.
#   warn  - печатает и пропускает, потолок 12 правил. Сюда идет все, у чего бывает
#           законное исключение. НЕДОБОР ЗНАКОВ ЖИВЕТ ТУТ И ТОЛЬКО ТУТ: верстка
#           собирается под готовый текст, а не текст под ячейку, и машины долива
#           воды до нижней границы в v8 нет.
#
# Строка правила - одна, это все, что реестр про него знает: как правило устроено,
# написано в самой проверке. Формат: id: "что проверяем".
#
# Чего тут нет намеренно: стилевых придирок. В v7 у валидатора было 33 предупреждения
# про кавычки, филлеры, штампы и дворовую лексику, их перестали читать на третьей
# странице. Суждение о формулировке выносит site-judge по docs/v8/rubric.md.

block:
  num_off_facts: "число с единицей измерения, которого нет ни в facts[] с publish yes, ни в реквизитах и датах заказчика"
  arith:         "число, посчитанное на лету из чужого: годовое на 12, месячное на 12, доля в проценты, процент от пары фактов"
  tainted:       "число из замера лидеров: форму и состав с рынка берем, цифры не берем никогда"
  hedge:         "около, порядка, примерно, более, свыше, от N, а также более сотни и десятки - при неподтвержденной цифре фраза не пишется вовсе"
  cta_stop:      "надпись кнопки из стоп-листа: отправить, подробнее, узнать больше, читать далее, перейти, оставить заявку, submit"
  jargon:        "жаргон кухни в клиентском тексте: Сургай, кастдев, customer dev, JTBD, CJM, оффер, лид, конверсия"
  typo:          "длинное и среднее тире и буква е с точками - во всем файле, включая метатеги и служебный хвост"
  hard_len:      "жесткие лимиты знаков, их ровно два вида: метатеги title 70 и description 160, интро категории 500"
  persona_quote: "прямая речь в кавычках, которой нет в audience.words с src forum либо client: persona дает смысл, но не цитату"
  no_hero:       "нет первого экрана: пустой H1 либо ни строки текста между H1 и первым подзаголовком"
  no_cta:        "на странице негде действовать: ни раздела cta, ни ссылки, ни строки-кнопки"
  fn_b_half:     "разделов с функцией В больше половины по колонке Ф из pages.yml: пустое место добито возражениями"

warn:
  chars_norm:    "раздел вне нормы знаков pages.yml с допуском автора плюс-минус 30 процентов; у режима tmpl меряется только верхняя граница"
  q_mark:        "метки q: над разделом нет либо ее id неизвестен - сборка идет позиционным фолбэком, опечатка хороший текст не валит"
  twins:         "пересечение closes: с соседней страницей от 70 процентов - одна мысль разными словами"
  plan_gap:      "блок плана не написан и не объявлен в хвосте строкой снят: либо слито:"
  off_plan:      "раздел, которого нет в действующем составе плана, либо раздел, снятый планом в stub"
  no_thought:    "в служебном хвосте нет первой строки мысль: - страница не называет, что доказывает"
  closes_empty:  "раздел без closes: - покрытие фактов и заготовка FAQ по нему слепы"
  bad_link:      "адрес страницы, написанный в тексте, и ссылка на адрес, которого нет в pages.json: адреса делает слаг-движок"
